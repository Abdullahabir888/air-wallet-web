<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Send, pay and exchange in Taka. Air Wallet on web, Android and iPhone, always in sync." />

    <!-- Icons: generated from brand/ (scripts/make-web-assets.py) -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Browser chrome colour follows the app theme (tokens.ts bg) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7FC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1020" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Air Wallet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X). Put your live domain in front of og-image.png:
         some apps ignore relative image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Air Wallet" />
    <meta property="og:title" content="Air Wallet" />
    <meta property="og:description" content="Send, pay and exchange in Taka. Web, Android and iPhone, always in sync." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background: #f4f7fc;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Loading screen: shown until the app takes over #root. Same mark and colours as the native splash. */
      .aw-splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .aw-splash svg {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 14px 28px rgba(37, 99, 235, 0.28));
        animation: aw-float 1.6s ease-in-out infinite;
      }
      .aw-splash i {
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: #e4eaf5;
        overflow: hidden;
        position: relative;
      }
      .aw-splash i::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #22d3ee, #2563eb);
        animation: aw-load 1.1s ease-in-out infinite;
      }
      @keyframes aw-float {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes aw-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a1020;
        }
        .aw-splash i {
          background: #1d2942;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .aw-splash svg,
        .aw-splash i::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Air Wallet needs JavaScript. Turn it on in your browser settings and reload.</noscript>
    <!-- The root element for your Expo app. The loading screen inside is replaced as soon as the app starts. -->
    <div id="root">
      <div class="aw-splash" role="status" aria-label="Loading Air Wallet">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="lgBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F9BFF"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient><linearGradient id="lgBack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#60A5FA"/></linearGradient><linearGradient id="lgSwoosh" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#A5F3FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs><rect x="13" y="8" width="38" height="16" rx="6" fill="url(#lgBack)" transform="rotate(-8 32 16)"/><rect x="6" y="16" width="48" height="40" rx="12" fill="url(#lgBody)"/><rect x="6" y="16" width="48" height="14" rx="10" fill="url(#gShine)" opacity=".35"/><path d="M18 48 28.5 24 39 48" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 42c10-5 22-4 34-14" fill="none" stroke="url(#lgSwoosh)" stroke-width="4" stroke-linecap="round"/><path d="M60 18 44 25.5l6 1.8 1.8 6z" fill="#fff"/><path d="M60 18 50 27.3l1.8 6z" fill="#DBEAFE"/><rect x="43" y="33" width="14" height="11" rx="5.5" fill="#1D4ED8"/><circle cx="50" cy="38.5" r="2.4" fill="#fff"/></svg>
        <i></i>
      </div>
    </div>
  </body>
</html>
